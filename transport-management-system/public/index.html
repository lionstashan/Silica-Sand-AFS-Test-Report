<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gate Entry System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Role Selection Modal -->
  <div id="role-modal" style="display: none;">
    <div class="role-modal-content">
      <h2>Select Your Role</h2>
      <div class="role-buttons">
        <button class="role-btn" data-role="Gate">Gate</button>
        <button class="role-btn" data-role="Dispatch">Dispatch</button>
        <button class="role-btn" data-role="Loading">Loading</button>
        <button class="role-btn" data-role="Weighbridge">Weighbridge</button>
        <button class="role-btn" data-role="Accounts">Accounts</button>
        <button class="role-btn" data-role="Admin">Admin</button>
      </div>
    </div>
  </div>

  <!-- PIN Entry Modal -->
  <div id="pin-modal" style="display: none;">
    <div class="pin-modal-content">
      <h2>Enter PIN</h2>
      <p id="pin-role-label"></p>
      <input type="password" id="pin-input" placeholder="Enter 4-digit PIN" maxlength="4" />
      <button id="pin-submit-btn">Submit</button>
      <button id="pin-cancel-btn">Back</button>
      <p id="pin-error-message" style="color: #b91c1c; display: none;"></p>
    </div>
  </div>

  <header>
    <h1>Gate Entry System</h1>
    <p>Record truck entries at the gate.</p>
    <nav>
      <span id="role-indicator" class="role-indicator" style="display: none;"></span>
      <a href="/dashboard" class="nav-link">Dashboard →</a>
      <a href="#" id="logout-link" class="nav-link" style="display: none;">Logout</a>
    </nav>
  </header>

  <section class="panel" style="display: none;">
    <h2>Gate Entry Form</h2>
    <form id="trip-form">
      <div class="form-grid">
        <label>Truck Number
          <input type="text" name="truck_number" required />
        </label>

        <label>Customer Name
          <select name="customer_name_select" id="customer-select" required>
            <option value="">Select Customer</option>
            <option value="Bhagwat Minerals">Bhagwat Minerals</option>
            <option value="Kamdhenu Minerals*">Kamdhenu Minerals*</option>
            <option value="Ganesh Minerals*">Ganesh Minerals*</option>
            <option value="JMD*">JMD*</option>
            <option value="Jaipur Silica Sand Pvt Ltd">Jaipur Silica Sand Pvt Ltd</option>
            <option value="Dashmesh Minerals Pvt Ltd">Dashmesh Minerals Pvt Ltd</option>
            <option value="Silica Sand India Pvt Ltd">Silica Sand India Pvt Ltd</option>
            <option value="Meenakshi Minerals">Meenakshi Minerals</option>
            <option value="R.R. Minerals">R.R. Minerals</option>
            <option value="Ojaswi Mines and Minerals">Ojaswi Mines and Minerals</option>
            <option value="SKM">SKM</option>
            <option value="RP Mines">RP Mines</option>
            <option value="Vishwakarma Minerals">Vishwakarma Minerals</option>
            <option value="Harsidhi Harbel">Harsidhi Harbel</option>
            <option value="Tejaswi Minerals">Tejaswi Minerals</option>
            <option value="other">Other</option>
          </select>
          <input type="text" name="customer_name" id="customer-other" placeholder="Enter customer name" style="display: none;" />
        </label>

        <label>Transporter
          <select name="transporter_select" id="transporter-select">
            <option value="">Select Transporter</option>
            <option value="XYZ Transport">XYZ Transport</option>
            <option value="LMN Logistics">LMN Logistics</option>
            <option value="other">Other</option>
          </select>
          <input type="text" name="transporter" id="transporter-other" placeholder="Enter transporter name" style="display: none;" />
        </label>

        <label>Driver Name
          <input type="text" name="driver_name" required />
        </label>

        <label>Driver Phone
          <input type="text" name="driver_phone" required />
        </label>

        <label>Gate Operator Name
          <select name="gate_person_select" id="gate-person-select" required>
            <option value="">Select Gate Operator</option>
            <option value="X">X</option>
            <option value="Y">Y</option>
            <option value="Z">Z</option>
            <option value="other">Other</option>
          </select>
          <input type="text" name="gate_person_name" id="gate-person-other" placeholder="Enter gate operator name" style="display: none;" />
        </label>
      </div>

      <div class="actions">
        <button type="submit" id="save-button">Submit Entry</button>
        <button type="button" id="clear-button">Clear</button>
      </div>
    </form>
  </section>

  <section class="panel" style="display: none;">
    <h2>Recent Entries</h2>
    <div id="message"></div>
    <div class="filters">
      <div class="filter-group">
        <label>Search Truck:
          <input type="text" id="truck-search" placeholder="Enter truck number..." />
        </label>
        <label>Filter Status:
          <select id="status-filter">
            <option value="">All Statuses</option>
          </select>
        </label>
      </div>
    </div>
    <div class="table-container desktop-only">
      <table class="trip-table-main">
        <thead>
          <tr>
            <th>Truck Number</th>
            <th>Status</th>
            <th>Assigned Manager/Operator</th>
            <th>Customer</th>
            <th>In Time</th>
            <th>Workflow / Actions</th>
          </tr>
        </thead>
        <tbody id="trips-table"></tbody>
      </table>
    </div>
    <div id="trips-mobile-list" class="mobile-trip-list mobile-only"></div>
  </section>

  <div id="timeline-modal" class="timeline-modal" style="display: none;">
    <div class="timeline-modal-content">
      <div class="timeline-modal-header">
        <h3 id="timeline-modal-title">Status Timeline</h3>
        <button type="button" class="timeline-close-btn" data-action="close-timeline">Close</button>
      </div>
      <div id="timeline-modal-body"></div>
    </div>
  </div>

  <script src="app.js?v=20260416-7"></script>
</body>
</html>
