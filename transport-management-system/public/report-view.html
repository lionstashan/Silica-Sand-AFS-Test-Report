<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report Viewer</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <section class="panel wide-panel rv-shell">
    <div class="workflow-row rv-top-controls" style="justify-content:space-between; margin-bottom: 8px;">
      <div class="workflow-row">
        <span id="role-indicator" class="role-indicator" style="display:none;"></span>
      </div>
      <div class="workflow-row">
        <select id="role-switcher" class="nav-link nav-btn" style="display:none;"></select>
        <a href="/" id="rv-logout-link" class="nav-link" style="display:none;">Logout</a>
      </div>
    </div>
    <div class="workflow-row rv-toolbar" style="justify-content:space-between;">
      <h2 id="rv-title">Lab Report</h2>
      <div class="workflow-row rv-toolbar-controls">
        <button type="button" id="rv-prev-btn">Previous</button>
        <button type="button" id="rv-next-btn">Next</button>
        <button type="button" id="rv-print-btn">Print</button>
        <a href="/reports" class="nav-link">Back</a>
      </div>
    </div>
    <div id="rv-branding"></div>
    <div id="rv-meta"></div>
    <div class="rv-summary-strip">
      <div><strong>Date:</strong> <span id="rv-date">-</span></div>
      <div><strong>Material:</strong> <span id="rv-material">-</span></div>
      <div><strong>Grade:</strong> <span id="rv-grade">-</span></div>
      <div><strong>AFS Value:</strong> <span id="rv-afs-val">0.00</span></div>
    </div>
    <div class="table-container">
      <table>
        <thead>
          <tr><th>Sr</th><th>Sieve</th><th>Aperture</th><th>Weight</th><th>Factor</th><th>Product</th></tr>
        </thead>
        <tbody id="rv-lines"></tbody>
      </table>
    </div>
    <div class="rv-chart-wrap">
      <h3>Sieve Analysis (Mesh vs Weight)</h3>
      <div id="rv-sieve-chart" class="rv-sieve-chart"></div>
    </div>
    <div class="workflow-row" style="margin-top:10px;">
      <span><strong>Total Qty:</strong> <span id="rv-total-qty">0.00</span></span>
      <span><strong>Total Product:</strong> <span id="rv-total-product">0.00</span></span>
      <span><strong>Total AFS:</strong> <span id="rv-total-afs">0.00</span></span>
    </div>
    <div id="rv-contact-footer" class="rv-contact-footer"></div>
  </section>
  <script src="/permissions.js?v=20260513-1"></script>
  <script src="/report-view.js?v=20260513-7"></script>
</body>
</html>
